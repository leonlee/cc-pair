name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke-test the packaged CLI installed globally
        run: |
          npm pack
          npm install -g ./*.tgz
          git init -q "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          pair init
          test -f AGENTS.md && test -f .claude/skills/pair/SKILL.md
          echo "smoke" | pair send request --as claude -
          pair wait --as codex --timeout 5 | grep -q "request from claude"
